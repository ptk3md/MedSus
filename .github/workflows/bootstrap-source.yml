name: Importar arquivos do projeto

on:
  push:
    paths:
      - '.bootstrap/project.tar.gz.b64'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extrair projeto
        shell: bash
        run: |
          base64 --decode .bootstrap/project.tar.gz.b64 > /tmp/medsus-source.tar.gz
          tar -xzf /tmp/medsus-source.tar.gz -C .

      - name: Publicar arquivos extraídos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
          else
            git commit -m "Importa código-fonte completo do MedSus"
            git push
          fi
